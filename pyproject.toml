[project]
name = "proiect-final"
version = "0.1.0"
description = "Indexare de documente si agent de intrebari cu RAG si ChromaDB"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.0.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
